<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alma del Eje | Cafés de Finca & Especialidad</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            hacienda: {
              verde: '#1A3326',
              verdeOscuro: '#112219',
              pergamino: '#F6F3EC',
              lacre: '#B87D3B',
              lacreHover: '#9E6629',
              teja: '#8E382B',
              carbon: '#1F1B18'
            }
          },
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    .perspective-container { perspective: 1000px; }
    .bag-3d { transform-style: preserve-3d; transition: transform 0.1s ease-out; }
  </style>
</head>

<body class="bg-hacienda-pergamino text-hacienda-carbon font-sans antialiased selection:bg-hacienda-lacre selection:text-white">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-hacienda-verde text-hacienda-pergamino border-b border-hacienda-lacre/30 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div>
        <span class="text-[10px] uppercase tracking-[0.3em] text-hacienda-lacre font-bold block">Tostaduría de Especialidad</span>
        <h1 class="font-serif text-2xl font-bold tracking-wider text-white">ALMA DEL EJE</h1>
      </div>
      
      <button onclick="toggleCart()" class="flex items-center gap-3 bg-hacienda-verdeOscuro hover:bg-hacienda-lacre transition-colors py-2.5 px-5 rounded-full border border-hacienda-lacre/40">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-hacienda-lacre" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
        <span class="text-sm font-medium">Pedido</span>
        <span id="cart-count" class="bg-hacienda-lacre text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <!-- CATÁLOGO -->
  <main class="max-w-7xl mx-auto px-6 py-14">
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 border-b border-hacienda-carbon/10 pb-6">
      <div>
        <h2 class="font-serif text-3xl md:text-4xl font-bold text-hacienda-verde">Cosechas Disponibles</h2>
        <p class="text-sm text-hacienda-carbon/60 mt-1">Sincronizado en tiempo real desde el maestro de tueste</p>
      </div>
      <span class="text-xs tracking-widest uppercase text-hacienda-lacre font-bold mt-4 md:mt-0">
        100% Arábica de Especialidad
      </span>
    </div>

    <!-- Grid generado 100% dinámicamente -->
    <div id="coffee-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Skeleton mientras lee el Sheet -->
      <div class="animate-pulse bg-white p-6 rounded-3xl h-96 border border-hacienda-carbon/10"></div>
      <div class="animate-pulse bg-white p-6 rounded-3xl h-96 border border-hacienda-carbon/10"></div>
      <div class="animate-pulse bg-white p-6 rounded-3xl h-96 border border-hacienda-carbon/10"></div>
    </div>
  </main>

  <!-- MODAL VISOR 360 & HISTORIA DEL DOC -->
  <div id="modal-detail" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
    <div class="bg-hacienda-pergamino max-w-4xl w-full rounded-3xl overflow-hidden shadow-2xl border border-hacienda-lacre/30 flex flex-col md:flex-row max-h-[90vh]">
      
      <!-- Visor 360 -->
      <div class="md:w-1/2 bg-hacienda-verde p-8 flex flex-col items-center justify-center relative perspective-container select-none">
        <span class="absolute top-4 left-4 text-[10px] tracking-widest uppercase bg-hacienda-lacre text-white px-3 py-1 rounded-full font-bold">
          Visor 360º Interactivo
        </span>
        <div id="bag-container" class="bag-3d cursor-grab active:cursor-grabbing w-64 h-80 flex items-center justify-center">
          <img id="modal-img" src="" alt="Empaque de Café" class="max-h-full max-w-full object-contain filter drop-shadow-2xl pointer-events-none" />
        </div>
        <p class="text-xs text-hacienda-pergamino/60 mt-4">🔄 Arrastra con el ratón o el dedo para rotar</p>
      </div>

      <!-- Ficha técnica e historia del Google Doc -->
      <div class="md:w-1/2 p-8 overflow-y-auto flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start">
            <span id="modal-origen" class="text-xs uppercase tracking-widest text-hacienda-lacre font-bold"></span>
            <button onclick="closeModal()" class="text-2xl text-hacienda-carbon/40 hover:text-hacienda-carbon">&times;</button>
          </div>
          
          <h3 id="modal-title" class="font-serif text-2xl md:text-3xl font-bold text-hacienda-verde mt-1 mb-2"></h3>
          <p id="modal-specs" class="text-xs text-hacienda-carbon/60 mb-6"></p>

          <h4 class="text-xs font-bold uppercase tracking-wider text-hacienda-carbon/80 mb-2 border-b border-hacienda-carbon/10 pb-1">
            Historia & Ficha de Cosecha
          </h4>
          <p id="modal-story" class="text-sm text-hacienda-carbon/80 leading-relaxed font-light whitespace-pre-line"></p>
        </div>

        <div class="mt-8 pt-4 border-t border-hacienda-carbon/10 flex items-center justify-between">
          <div>
            <span class="text-xs text-hacienda-carbon/50 block">Precio desde</span>
            <span id="modal-price" class="font-serif text-2xl font-bold text-hacienda-verde"></span>
          </div>
          <button onclick="closeModal()" class="bg-hacienda-verde hover:bg-hacienda-verdeOscuro text-white px-6 py-2.5 rounded-xl text-sm font-medium transition-all">
            Volver a la Tienda
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- CARRITO -->
  <div id="cart-drawer" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300">
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-hacienda-pergamino p-6 shadow-2xl flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between pb-4 border-b border-hacienda-carbon/10">
          <h4 class="font-serif text-xl font-bold text-hacienda-verde">Tu Pedido</h4>
          <button onclick="toggleCart()" class="text-hacienda-carbon/50 hover:text-hacienda-carbon text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="mt-6 space-y-4 max-h-[60vh] overflow-y-auto pr-2"></div>
      </div>

      <div class="border-t border-hacienda-carbon/10 pt-4 space-y-4">
        <div class="flex justify-between items-center text-lg font-bold text-hacienda-verde">
          <span>Total</span>
          <span id="cart-total">0.00 €</span>
        </div>
        <button onclick="checkout()" id="btn-checkout" class="w-full bg-hacienda-verde hover:bg-hacienda-verdeOscuro text-white py-4 rounded-xl font-medium tracking-wide transition-all shadow-md">
          Confirmar y Tostar Pedido
        </button>
      </div>
    </div>
  </div>

  <script>
    // PEGA AQUÍ LA URL DE TU APPS SCRIPT
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzP9TxsoNYZvul3p37BIvlBQyHr6_O8zEarYxJ-JRFisEC0eAok7l8W4X8NBkzQptb8xg/exec";

    let catalogo = [];
    let carrito = [];

    // Carga dinámica de cafés desde el Google Sheet
    async function loadCatalog() {
      const grid = document.getElementById("coffee-grid");
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const json = await res.json();
        
        if(json.status === "success" && json.data.length > 0) {
          catalogo = json.data;
          renderCatalog();
        } else {
          grid.innerHTML = `<p class="col-span-3 text-center py-12 text-hacienda-carbon/60">No hay cosechas activas en el inventario actualmente.</p>`;
        }
      } catch (err) {
        grid.innerHTML = `<div class="col-span-3 text-center py-12 text-hacienda-teja">
          <p class="font-bold">Error al conectar con la base de datos.</p>
          <p class="text-xs mt-1 text-hacienda-carbon/60">Revisa la URL de Apps Script y los permisos de ejecución.</p>
        </div>`;
      }
    }

    // Renderiza los cafés sin importar cuántos existan en el Sheet
    function renderCatalog() {
      const grid = document.getElementById("coffee-grid");
      grid.innerHTML = "";

      catalogo.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-3xl border border-hacienda-carbon/10 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between group";

        card.innerHTML = `
          <div class="p-8 pb-0">
            <div class="flex justify-between items-start mb-4">
              <span class="text-xs uppercase tracking-widest font-semibold text-hacienda-lacre">${item.pais} · ${item.variedad}</span>
              <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold ${item.estado === 'Últimas Unidades' ? 'bg-hacienda-teja/10 text-hacienda-teja' : 'bg-hacienda-verde/10 text-hacienda-verde'}">
                ${item.estado}
              </span>
            </div>

            <!-- Imagen dinámica -->
            <div onclick="openModal('${item.idLote}')" class="cursor-pointer my-4 flex items-center justify-center h-56 bg-hacienda-pergamino/50 rounded-2xl group-hover:bg-hacienda-pergamino transition-all overflow-hidden relative border border-hacienda-carbon/5">
              <img src="${item.imagenUrl}" alt="${item.regionFinca}" class="h-full w-full object-cover object-center group-hover:scale-105 transition-transform duration-500" />
              <span class="absolute bottom-2 bg-hacienda-verdeOscuro/80 backdrop-blur-sm text-white text-[10px] tracking-wider uppercase px-3 py-1 rounded-full shadow">
                Ver 360º & Historia
              </span>
            </div>

            <h4 onclick="openModal('${item.idLote}')" class="cursor-pointer font-serif text-2xl font-bold text-hacienda-verde mb-1 hover:text-hacienda-lacre transition-colors">${item.regionFinca}</h4>
            <p class="text-xs text-hacienda-carbon/60 mb-4">${item.proceso} · ${item.altura}</p>

            <div class="flex flex-wrap gap-1.5 mb-6">
              ${item.notasCatas.map(n => `<span class="bg-hacienda-pergamino text-hacienda-carbon/80 text-xs px-2.5 py-1 rounded-md border border-hacienda-carbon/5">${n}</span>`).join('')}
            </div>

            <!-- Formato & Molienda -->
            <div class="space-y-4 pt-4 border-t border-hacienda-carbon/10">
              <div class="grid grid-cols-3 gap-2" id="format-${item.idLote}">
                <button onclick="setFormat('${item.idLote}', '250g', ${item.precios['250g']})" class="py-1.5 text-xs font-medium rounded-lg border border-hacienda-verde bg-hacienda-verde text-white">250g</button>
                <button onclick="setFormat('${item.idLote}', '500g', ${item.precios['500g']})" class="py-1.5 text-xs font-medium rounded-lg border border-hacienda-carbon/20">500g</button>
                <button onclick="setFormat('${item.idLote}', '1000g', ${item.precios['1000g']})" class="py-1.5 text-xs font-medium rounded-lg border border-hacienda-carbon/20">1 Kg</button>
              </div>

              <select id="grind-${item.idLote}" class="w-full bg-hacienda-pergamino border border-hacienda-carbon/20 rounded-xl px-3 py-2 text-xs">
                <option value="Grano Entero">Grano Entero (Tueste Fresco)</option>
                <option value="Espresso">Molido Espresso</option>
                <option value="Filtro V60/Chemex">Molido Filtro / V60</option>
                <option value="Prensa Francesa">Molido Prensa Francesa</option>
              </select>
            </div>
          </div>

          <div class="p-8 pt-6 flex items-center justify-between">
            <div>
              <span class="text-xs text-hacienda-carbon/50 block">Precio</span>
              <span id="price-${item.idLote}" class="text-2xl font-bold font-serif text-hacienda-verde">${item.precios['250g'].toFixed(2)} €</span>
            </div>
            <button onclick="addToCart('${item.idLote}')" class="bg-hacienda-lacre hover:bg-hacienda-lacreHover text-white px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-sm">
              Añadir
            </button>
          </div>
        `;
        grid.appendChild(card);
        card.dataset.selectedFormat = "250g";
        card.dataset.selectedPrice = item.precios['250g'];
      });
    }

    function setFormat(idLote, format, price) {
      const container = document.getElementById(`format-${idLote}`);
      container.querySelectorAll("button").forEach(b => b.className = "py-1.5 text-xs font-medium rounded-lg border border-hacienda-carbon/20");
      event.target.className = "py-1.5 text-xs font-medium rounded-lg border border-hacienda-verde bg-hacienda-verde text-white";
      document.getElementById(`price-${idLote}`).innerText = price.toFixed(2) + " €";
      const card = container.closest('.group');
      card.dataset.selectedFormat = format;
      card.dataset.selectedPrice = price;
    }

    // Modal 360
    function openModal(idLote) {
      const item = catalogo.find(c => c.idLote === idLote);
      if(!item) return;

      document.getElementById("modal-img").src = item.imagenUrl;
      document.getElementById("modal-origen").innerText = `${item.pais} · ${item.variedad}`;
      document.getElementById("modal-title").innerText = item.regionFinca;
      document.getElementById("modal-specs").innerText = `Proceso: ${item.proceso} | Altura: ${item.altura}`;
      document.getElementById("modal-story").innerText = item.historia;
      document.getElementById("modal-price").innerText = `${item.precios['250g'].toFixed(2)} €`;

      const modal = document.getElementById("modal-detail");
      modal.classList.remove("hidden");
      setTimeout(() => modal.classList.remove("opacity-0"), 10);
    }

    function closeModal() {
      const modal = document.getElementById("modal-detail");
      modal.classList.add("opacity-0");
      setTimeout(() => modal.classList.add("hidden"), 300);
    }

    // Rotación 360 interactiva
    const bagContainer = document.getElementById("bag-container");
    let isDragging = false, startX = 0, currentRotY = 0;

    bagContainer.addEventListener("mousedown", (e) => { isDragging = true; startX = e.clientX; });
    window.addEventListener("mouseup", () => isDragging = false);
    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      currentRotY += deltaX * 0.4;
      bagContainer.style.transform = `rotateY(${currentRotY}deg) rotateX(${-deltaX * 0.1}deg)`;
      startX = e.clientX;
    });

    bagContainer.addEventListener("touchstart", (e) => { isDragging = true; startX = e.touches[0].clientX; });
    window.addEventListener("touchend", () => isDragging = false);
    window.addEventListener("touchmove", (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      currentRotY += deltaX * 0.6;
      bagContainer.style.transform = `rotateY(${currentRotY}deg)`;
      startX = e.touches[0].clientX;
    });

    // Carrito y Pedidos
    function addToCart(idLote) {
      const coffee = catalogo.find(c => c.idLote === idLote);
      const card = document.getElementById(`format-${idLote}`).closest('.group');
      const format = card.dataset.selectedFormat || "250g";
      const price = parseFloat(card.dataset.selectedPrice) || coffee.precios["250g"];
      const grind = document.getElementById(`grind-${idLote}`).value;

      const item = carrito.find(i => i.idLote === idLote && i.formato === format && i.molienda === grind);
      if(item) { item.cantidad++; } 
      else {
        carrito.push({
          idLote: coffee.idLote,
          finca: coffee.regionFinca,
          formato: format,
          formatoGramos: parseInt(format.replace('g','').replace('1 Kg','1000')),
          molienda: grind,
          precioUnitario: price,
          cantidad: 1
        });
      }
      updateCartUI();
      toggleCart(true);
    }

    function updateCartUI() {
      const count = carrito.reduce((acc, item) => acc + item.cantidad, 0);
      document.getElementById("cart-count").innerText = count;
      const container = document.getElementById("cart-items");
      container.innerHTML = "";
      let total = 0;

      carrito.forEach((item, index) => {
        const subtotal = item.precioUnitario * item.cantidad;
        total += subtotal;
        container.innerHTML += `
          <div class="bg-white p-4 rounded-xl border border-hacienda-carbon/10 flex justify-between items-start">
            <div>
              <h5 class="font-bold text-sm text-hacienda-verde">${item.finca}</h5>
              <p class="text-xs text-hacienda-carbon/60">${item.formato} · ${item.molienda}</p>
              <div class="flex items-center gap-3 mt-3">
                <button onclick="changeQty(${index}, -1)" class="w-6 h-6 rounded bg-hacienda-pergamino text-xs font-bold">-</button>
                <span class="text-xs font-bold">${item.cantidad}</span>
                <button onclick="changeQty(${index}, 1)" class="w-6 h-6 rounded bg-hacienda-pergamino text-xs font-bold">+</button>
              </div>
            </div>
            <div class="text-right">
              <span class="text-sm font-bold font-serif text-hacienda-verde">${subtotal.toFixed(2)} €</span>
              <button onclick="removeItem(${index})" class="block text-xs text-hacienda-teja mt-2">Eliminar</button>
            </div>
          </div>
        `;
      });
      document.getElementById("cart-total").innerText = total.toFixed(2) + " €";
    }

    function changeQty(idx, d) {
      carrito[idx].cantidad += d;
      if(carrito[idx].cantidad <= 0) carrito.splice(idx, 1);
      updateCartUI();
    }

    function removeItem(idx) {
      carrito.splice(idx, 1);
      updateCartUI();
    }

    function toggleCart(forceOpen = false) {
      const drawer = document.getElementById("cart-drawer");
      if (forceOpen || drawer.classList.contains("hidden")) {
        drawer.classList.remove("hidden");
        setTimeout(() => drawer.classList.remove("opacity-0"), 10);
      } else {
        drawer.classList.add("opacity-0");
        setTimeout(() => drawer.classList.add("hidden"), 300);
      }
    }

    async function checkout() {
      if(carrito.length === 0) return alert("El carrito está vacío.");
      const btn = document.getElementById("btn-checkout");
      btn.disabled = true;
      btn.innerText = "Registrando en Tostaduría...";

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: carrito, cliente: { email: "pedidos.web@gmail.com" } })
        });
        alert("¡Pedido registrado con éxito en el Google Sheet!");
        carrito = [];
        updateCartUI();
        toggleCart();
        loadCatalog();
      } catch (e) {
        alert("Error: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Confirmar y Tostar Pedido";
      }
    }

    window.onload = loadCatalog;
  </script>
</body>
</html>
